# Fichier : k8s/ia-api-hpa.yaml (Version "douce" et stable)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ia-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ia-api-deployment
  minReplicas: 1
  maxReplicas: 5
  metrics:
    # ... (vos métriques CPU et RAM ne changent pas)
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 90
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 98
  behavior:
    scaleUp:
      # On garde une longue fenêtre de stabilisation
      stabilizationWindowSeconds: 300
      policies:
      # ====> LA MODIFICATION CLÉ <====
      # On ne l'autorise à ajouter qu'UN SEUL pod toutes les 5 minutes (300s)
      - type: Pods
        value: 1
        periodSeconds: 300
      selectPolicy: Max # (Il n'y a qu'une politique, donc c'est elle qui sera choisie)

    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Pods
        value: 1
        periodSeconds: 120
      selectPolicy: Max