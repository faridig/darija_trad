# k8s/grafana.yaml

# Le PVC ne change pas.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# On modifie le Deployment pour utiliser la politique de changement de groupe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      # ================================================================
      # ===> CORRECTION APPLIQUÉE ICI <=================================
      # ================================================================
      securityContext:
        fsGroup: 472
        runAsUser: 472
        runAsGroup: 472
        # Cette politique demande à Kubernetes de corriger les permissions du volume
        # si le propriétaire est 'root', ce qui est le cas lors du premier montage.
        fsGroupChangePolicy: "OnRootMismatch"
      # ================================================================

      # On a supprimé la section 'initContainers' qui causait le crash.
      
      containers:
      - name: grafana-container
        image: iaapi.azurecr.io/darija-api-grafana:latest
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
      volumes:
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: grafana-pvc
      imagePullSecrets:
      - name: acr-secret
---
# Le Service ne change pas.
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
  - protocol: TCP
    port: 3000 
    targetPort: 3000