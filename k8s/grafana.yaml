# k8s/grafana.yaml

# 1. La demande de stockage (PVC) ne change pas. Elle est correcte.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
spec:
  accessModes:
    - ReadWriteOnce  # Le disque peut être monté en lecture/écriture par un seul pod à la fois
  resources:
    requests:
      storage: 1Gi      # On demande 1 Giga-octet de stockage
---
# 2. On modifie le Deployment pour ajouter le securityContext à l'initContainer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      # Ce contexte de sécurité s'appliquera au conteneur Grafana principal.
      securityContext:
        fsGroup: 472
        runAsUser: 472
        runAsGroup: 472
      
      # Ce conteneur s'exécute AVANT le conteneur Grafana principal.
      initContainers:
      - name: fix-permissions
        # On utilise une image Linux minimale pour cette tâche.
        image: busybox:latest
        # Sa seule mission : changer le propriétaire du volume pour l'utilisateur Grafana (ID 472).
        command: ["sh", "-c", "chown -R 472:472 /var/lib/grafana"]
        securityContext:
          runAsUser: 0
        # ================================================================
        # Il doit monter le même volume pour pouvoir le modifier.
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
      
      containers:
      - name: grafana-container
        image: iaapi.azurecr.io/darija-api-grafana:latest
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: grafana-storage # Nom du montage
          mountPath: /var/lib/grafana # Chemin dans le conteneur
      volumes:
      - name: grafana-storage # Doit correspondre au nom du montage
        persistentVolumeClaim:
          claimName: grafana-pvc # On lie ce volume à notre PVC
      imagePullSecrets:
      - name: acr-secret
---
# Le Service reste inchangé. Il est correct.
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
  - protocol: TCP
    port: 3000 
    targetPort: 3000