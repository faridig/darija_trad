# Fichier : k8s/api.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia-api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ia-api
  template:
    metadata:
      labels:
        app: ia-api
    spec:
      containers:
      - name: ia-api-container
        image: iaapi.azurecr.io/darija-api:latest
        ports:
        - containerPort: 8001
        
        resources:
          requests:
            cpu: "500m"
            memory: "4Gi"
          limits:
            cpu: "2"
            memory: "6Gi"
        
        # ================================================================
        # ===> CORRECTION APPLIQUÉE ICI <=================================
        # ================================================================
        # Sonde de vivacité : pour savoir si le pod doit être redémarré.
        # On lui donne BEAUCOUP de temps pour démarrer.
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 120  # On attend 2 minutes avant le premier check.
          periodSeconds: 30       # On vérifie toutes les 30 secondes ensuite.
          timeoutSeconds: 5         # On attend jusqu'à 5 secondes pour une réponse.
          failureThreshold: 3       # On tolère 3 échecs avant de redémarrer.

        # Sonde de préparation : pour savoir si le pod peut accepter du trafic.
        # C'est la sonde la plus importante pour un démarrage en douceur.
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 90   # On attend 90 secondes avant de le considérer "prêt".
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        # ================================================================
          
        envFrom:
        - secretRef:
            name: api-secrets
      imagePullSecrets:
      - name: acr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: ia-api-service
spec:
  type: LoadBalancer 
  selector:
    app: ia-api
  ports:
  - protocol: TCP
    port: 8001
    targetPort: 8001