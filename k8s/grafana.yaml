# k8s/grafana.yaml

# 1. On crée d'abord la demande de stockage (PVC)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
spec:
  accessModes:
    - ReadWriteOnce  # Le disque peut être monté en lecture/écriture par un seul pod à la fois
  resources:
    requests:
      storage: 1Gi      # On demande 1 Giga-octet de stockage
---
# 2. Ensuite, on modifie le Deployment pour utiliser ce PVC
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
        runAsGroup: 472
      containers:
      - name: grafana-container
        image: iaapi.azurecr.io/darija-api-grafana:latest
        ports:
        - containerPort: 3000
        volumeMounts: # <-- ON AJOUTE CECI
        - name: grafana-storage # Nom du montage
          mountPath: /var/lib/grafana # Chemin dans le conteneur
      volumes: # <-- ET CECI
      - name: grafana-storage # Doit correspondre au nom du montage
        persistentVolumeClaim:
          claimName: grafana-pvc # On lie ce volume à notre PVC
      imagePullSecrets:
      - name: acr-secret
---
# Le Service reste inchangé
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
  - protocol: TCP
    port: 3000 
    targetPort: 3000