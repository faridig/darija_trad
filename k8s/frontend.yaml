# Fichier : k8s/frontend.yaml (Version Corrigée)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # Secret pour s'authentifier auprès du registre d'images privé (ACR).
      imagePullSecrets:
      - name: acr-secret
      
      containers:
      - name: frontend-container
        # L'image sera mise à jour par le pipeline CI/CD.
        image: iaapi.azurecr.io/darija-frontend:latest
        imagePullPolicy: Always
        
        ports:
        - containerPort: 80
          protocol: TCP

        # Sonde pour vérifier que Nginx est prêt à recevoir du trafic.
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10

        # Injection des variables d'environnement pour le script d'entrée du conteneur.
        env:
          - name: VITE_DATA_API_BASE_URL
            valueFrom:
              secretKeyRef:
                name: api-secrets
                key: VITE_DATA_API_BASE_URL

          - name: VITE_IA_API_BASE_URL
            valueFrom:
              secretKeyRef:
                name: api-secrets
                key: VITE_IA_API_BASE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: frontend
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 80