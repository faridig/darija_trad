# Fichier : k8s/data-api.yaml (Version finale et robuste)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-api
  template:
    metadata:
      labels:
        app: data-api
    spec:
      imagePullSecrets:
      - name: acr-secret
      
      containers:
      - name: data-api-container
        # Cette image sera mise à jour dynamiquement par votre pipeline CI/CD
        image: iaapi.azurecr.io/darija-data-api:871985e 
        imagePullPolicy: Always 
        ports:
        - containerPort: 8000

        # ================================================================
        # ===> CONFIGURATION DES SONDES AMÉLIORÉE <=======================
        # ================================================================

        # Sonde de VIVACITÉ (Liveness): 
        # Détermine si le conteneur doit être redémarré.
        # On la garde très tolérante pour éviter les redémarrages inutiles.
        livenessProbe:
          httpGet:
            path: /docs  # Un endpoint léger qui ne dépend pas de la DB est idéal.
            port: 8000
          initialDelaySeconds: 80 # Laisse beaucoup de temps pour le premier démarrage.
          periodSeconds: 20       # Vérifie toutes les 20 secondes.
          timeoutSeconds: 15       # La requête doit répondre en moins de 5s.
          failureThreshold: 10    # Redémarre seulement après 10 échecs consécutifs (plus de 3 minutes de panne).

        # Sonde de PRÉPARATION (Readiness): 
        # Détermine si le pod est prêt à recevoir du trafic du Service.
        # Elle peut être un peu plus rapide pour intégrer le pod au service dès que possible.
        readinessProbe:
          httpGet:
            path: /docs
            port: 8000
          initialDelaySeconds: 15 # On commence à vérifier plus tôt.
          periodSeconds: 10       # On vérifie plus souvent.
          timeoutSeconds: 15
          failureThreshold: 3     # Après 3 échecs, le pod est considéré "NotReady" et retiré du service.

        # ================================================================
        
        envFrom:
        - secretRef:
            name: api-secrets 
---
apiVersion: v1
kind: Service
metadata:
  name: data-api-service
spec:
  type: LoadBalancer 
  selector:
    app: data-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000