# Fichier : k8s/api.yaml (Version finale et robuste)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia-api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ia-api
  template:
    metadata:
      labels:
        app: ia-api
    spec:
      containers:
      - name: ia-api-container
        # Ce tag sera mis à jour dynamiquement par votre pipeline CI/CD
        image: iaapi.azurecr.io/darija-api:latest 
        ports:
        - containerPort: 8001
        
        # Les ressources sont adaptées pour le cas "API externe" (léger)
        # Si vous revenez à un modèle local, il faudra les ré-augmenter.
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        
        # ================================================================
        # ===> CONFIGURATION DES SONDES AFFINÉE <=========================
        # ================================================================

        # Sonde de DÉMARRAGE (Startup):
        # Donne à l'application le temps de démarrer avant que les autres sondes ne s'activent.
        # Même pour une API externe, on garde un délai raisonnable pour la première connexion.
        startupProbe:
          httpGet:
            path: /health
            port: 8001
          # Laisse jusqu'à 2 minutes pour le premier démarrage réussi (12 * 10s).
          failureThreshold: 12
          periodSeconds: 10

        # Sonde de VIVACITÉ (Liveness):
        # S'active après le succès de la startupProbe.
        # Redémarre le pod s'il ne répond plus du tout.
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          # Commence à vérifier 15s après le démarrage réussi.
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 15
          # Redémarre après 3 échecs consécutifs (1 minute de panne).
          failureThreshold: 3

        # Sonde de PRÉPARATION (Readiness):
        # S'active après le succès de la startupProbe.
        # Détermine si le pod est prêt à recevoir du trafic.
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          # Commence à vérifier 5s après le démarrage réussi.
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 15
          # Retire le pod du service après 3 échecs consécutifs (30s de panne).
          failureThreshold: 3
          
        envFrom:
        - secretRef:
            name: api-secrets
      imagePullSecrets:
      - name: acr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: ia-api-service
spec:
  type: LoadBalancer 
  selector:
    app: ia-api
  ports:
  - protocol: TCP
    port: 8001
    targetPort: 8001