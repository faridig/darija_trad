# Fichier : k8s/api.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia-api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ia-api
  template:
    metadata:
      labels:
        app: ia-api
    spec:
      containers:
      - name: ia-api-container
        image: iaapi.azurecr.io/darija-api:latest # Ce tag sera mis à jour par la CI/CD
        ports:
        - containerPort: 8001
        
        # --- DÉBUT DE LA CONFIGURATION ÉTAPE 1 ---
        resources:
          # C'est la réservation garantie pour votre pod.
          # L'autoscaler se basera sur ces valeurs.
          requests:
            cpu: "250m"       # On réserve 0.25 cœur CPU
            memory: "512Mi"   # On réserve 512 Mebibytes de RAM
          
          # C'est le plafond maximum.
          # Empêche un pod de faire planter tout le Nœud.
          limits:
            cpu: "1"          # Limité à 1 cœur CPU
            memory: "1Gi"     # Limité à 1 Gigabyte de RAM
        
        # On ajoute aussi la sonde de santé, c'est une bonne pratique.
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 20
          periodSeconds: 30
        # --- FIN DE LA CONFIGURATION ÉTAPE 1 ---
          
        envFrom:
        - secretRef:
            name: api-secrets
      imagePullSecrets:
      - name: acr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: ia-api-service
spec:
  type: LoadBalancer 
  selector:
    app: ia-api
  ports:
  - protocol: TCP
    port: 8001
    targetPort: 8001