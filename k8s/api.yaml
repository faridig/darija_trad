# Fichier : k8s/api.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia-api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ia-api
  template:
    metadata:
      labels:
        app: ia-api
    spec:
      containers:
      - name: ia-api-container
        image: iaapi.azurecr.io/darija-api:latest # Ce tag sera mis à jour par la CI/CD
        ports:
        - containerPort: 8001
        
        # --- CONFIGURATION DES RESSOURCES MISE À JOUR ---
        resources:
          # La réservation garantie pour votre pod.
          requests:
            cpu: "500m"
            memory: "4Gi"
          
          # Le plafond maximum, avec une marge pour le démarrage.
          limits:
            cpu: "2"
            memory: "8Gi" # Augmenté pour gérer le pic de chargement du modèle.
        
        # --- CONFIGURATION DES SONDES MISE À JOUR (PLUS ROBUSTE) ---
        # 1. Sonde de DÉMARRAGE : a la priorité pour les applications lentes.
        # Kubernetes attendra jusqu'à 5 minutes (30 * 10s) que cette sonde réussisse.
        startupProbe:
          httpGet:
            path: /health
            port: 8001
          failureThreshold: 30
          periodSeconds: 10
          timeoutSeconds: 5

        # 2. Sonde de VIVACITÉ : ne s'active qu'APRES le succès de la startupProbe.
        # Vérifie si l'application est toujours en vie une fois démarrée.
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 15 # Petit délai de grâce après le démarrage réussi.
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        # 3. Sonde de PRÉPARATION : ne s'active qu'APRES le succès de la startupProbe.
        # Indique quand le pod est prêt à recevoir du trafic.
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5 # Petit délai de grâce après le démarrage réussi.
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
          
        envFrom:
        - secretRef:
            name: api-secrets
      imagePullSecrets:
      - name: acr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: ia-api-service
spec:
  type: LoadBalancer 
  selector:
    app: ia-api
  ports:
  - protocol: TCP
    port: 8001
    targetPort: 8001