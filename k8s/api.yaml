# Fichier : k8s/api.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia-api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ia-api
  template:
    metadata:
      labels:
        app: ia-api
    spec:
      containers:
      - name: ia-api-container
        image: iaapi.azurecr.io/darija-api:latest # Ce tag sera mis à jour par la CI/CD
        ports:
        - containerPort: 8001
        
        # Les ressources restent inchangées, elles sont correctes.
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "6Gi"
        
        # --- SONDES MISES À JOUR POUR UN DÉLAI DE 15 MINUTES ---
        # 1. Sonde de DÉMARRAGE :
        #    Kubernetes attendra maintenant jusqu'à 15 minutes (30 échecs * 30s)
        #    que cette sonde réussisse avant de considérer le pod comme échoué.
        startupProbe:
          httpGet:
            path: /health
            port: 8001
          failureThreshold: 30
          periodSeconds: 30 # Augmenté pour vérifier moins souvent
          timeoutSeconds: 10 # Légère augmentation pour plus de tolérance

        # 2. Sonde de VIVACITÉ : ne s'active qu'après le succès de la startupProbe.
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        # 3. Sonde de PRÉPARATION : ne s'active qu'après le succès de la startupProbe.
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
          
        envFrom:
        - secretRef:
            name: api-secrets
      imagePullSecrets:
      - name: acr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: ia-api-service
spec:
  type: LoadBalancer 
  selector:
    app: ia-api
  ports:
  - protocol: TCP
    port: 8001
    targetPort: 8001