# .github/workflows/ci-cd-frontend.yml

name: CI/CD - Application Frontend

on:
  push:
    branches: [ master, main ]
    paths:
      - 'frontend/**'
      - 'k8s/frontend.yaml'
      - '.github/workflows/ci-cd-frontend.yml'
  
  pull_request:
    branches: [ master, main ]
    paths:
      - 'frontend/**'
      - 'k8s/frontend.yaml'
      - '.github/workflows/ci-cd-frontend.yml' # Ajout pour tester sur les PR

  workflow_dispatch:

jobs:
  # =====================================================================
  # JOB 1 : TESTER L'APPLICATION FRONTEND (INTÉGRATION CONTINUE)
  # ====================================================================
  test-frontend:
    name: 1 - Test de l'application Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js v18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci # 'ci' est plus rapide et plus sûr pour la CI que 'install'
        working-directory: ./frontend

      - name: Lancer les tests (unitaires et intégration)
        run: npm test -- --run # '--run' est crucial pour que Vitest quitte après l'exécution
        working-directory: ./frontend

      - name: Générer le rapport de couverture de code
        # S'exécute toujours, même si l'étape précédente échoue, pour pouvoir analyser
        if: always() 
        run: npm run coverage
        working-directory: ./frontend
        
      - name: Uploader le rapport de couverture comme artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-couverture-frontend
          path: frontend/coverage/
          retention-days: 7

  # ====================================================================
  # JOB 2 : CONSTRUIRE L'IMAGE DOCKER ET LA POUSSER SUR ACR
  # ====================================================================
  build-and-push-image:
    name: 2 - Build et Push de l'image Frontend
    runs-on: ubuntu-latest
    needs: test-frontend # <-- NE SE LANCE QUE SI LES TESTS RÉUSSISSENT

    # S'exécute uniquement sur un push vers la branche principale pour éviter
    # de construire des images pour chaque commit de PR.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à Azure Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/darija-frontend:latest
            ${{ secrets.ACR_NAME }}.azurecr.io/darija-frontend:${{ github.sha }}

  # ======================================================================
  # JOB 3 : DÉPLOYER L'APPLICATION SUR AKS
  # =====================================================================
  deploy-to-aks:
    name: 3 - Déploiement du Frontend sur AKS
    runs-on: self-hosted # Ou ubuntu-latest
    needs: build-and-push-image
    # Le 'if' du job précédent garantit que celui-ci ne s'exécute aussi que sur un push vers master/main.

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation et configuration de kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Vérifier la connexion kubectl
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Supprimer le secret existant (ignore si non trouvé)
        run: |
          kubectl delete secret api-secrets --ignore-not-found=true

      # ================================================================
      # ===> MODIFICATION APPLIQUÉE ICI <===============================
      # ================================================================
      - name: Créer/Mettre à jour le secret unifié pour les APIs
        run: |
          kubectl create secret generic api-secrets \
            --from-literal=ADMIN_USERNAME='${{ secrets.ADMIN_USERNAME }}' \
            --from-literal=ADMIN_PASSWORD='${{ secrets.ADMIN_PASSWORD }}' \
            --from-literal=SUPABASE_URL='${{ secrets.SUPABASE_URL }}' \
            --from-literal=JWT_SECRET='${{ secrets.JWT_SECRET }}' \
            --from-literal=BASE_URL='${{ secrets.BASE_URL }}' \
            --from-literal=VITE_DATA_API_BASE_URL='${{ secrets.VITE_DATA_API_BASE_URL }}' \
            --from-literal=VITE_IA_API_BASE_URL='${{ secrets.VITE_IA_API_BASE_URL }}' \
            --from-literal=HF_TOKEN='${{ secrets.HF_TOKEN_AI }}' \
            --from-literal=HF_INFERENCE_ENDPOINT_URL='${{ secrets.HF_INFERENCE_ENDPOINT_URL }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Mettre à jour le tag de l'image dans le manifeste Frontend
        run: |
          IMAGE_TAG=${{ github.sha }}
          ACR_NAME=${{ secrets.ACR_NAME }}
          
          echo "Mise à jour de k8s/frontend.yaml avec le tag : $IMAGE_TAG"
          
          # Commande 'sed' pour remplacer le tag de l'image du frontend
          sed -i "s|image: $ACR_NAME.azurecr.io/darija-frontend:.*|image: $ACR_NAME.azurecr.io/darija-frontend:$IMAGE_TAG|g" k8s/frontend.yaml
          
          echo "Contenu de k8s/frontend.yaml après modification :"
          cat k8s/frontend.yaml

      - name: Déployer les manifestes Kubernetes
        run: |
          # Applique uniquement le fichier YAML du frontend qui vient d'être modifié
          kubectl apply -f k8s/frontend.yaml
      
      - name: Vérifier l'état du déploiement
        run: |
          # Attend que le nouveau déploiement soit terminé avec succès
          kubectl rollout status deployment/frontend-deployment