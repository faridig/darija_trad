# .github/workflows/ci-cd-frontend.yml

# ==============================================================================
# WORKFLOW D'INTÉGRATION ET DE DÉPLOIEMENT CONTINUS (CI/CD) - FRONTEND
# ------------------------------------------------------------------------------
# Rôle :
# Ce workflow automatise le cycle de vie complet de l'application Frontend (React).
# Il est conçu pour garantir la qualité du code, construire une image Docker
# portable et déployer l'application de manière fiable sur un cluster Kubernetes (AKS).
#
# Déclencheurs :
# - Push ou Pull Request sur les branches 'master' ou 'main'.
# - Uniquement si les fichiers modifiés concernent le frontend (`frontend/**`),
#   son déploiement (`k8s/frontend.yaml`), ou le workflow lui-même.
# - Peut aussi être lancé manuellement via l'interface GitHub (`workflow_dispatch`).
# ==============================================================================

name: CI/CD - Application Frontend

on:
  push:
    branches: [ master, main ]
    paths:
      - 'frontend/**'
      - 'k8s/frontend.yaml'
      - '.github/workflows/ci-cd-frontend.yml'
  
  pull_request:
    branches: [ master, main ]
    paths:
      - 'frontend/**'
      - 'k8s/frontend.yaml'
      - '.github/workflows/ci-cd-frontend.yml'

  workflow_dispatch:

jobs:
  # =====================================================================
  # JOB 1 : TESTER L'APPLICATION FRONTEND (INTÉGRATION CONTINUE - CI)
  # ====================================================================
  test-frontend:
    name: 1 - Test de l'application Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js v18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: |
          echo " Lancement de 'npm ci' pour une installation propre et rapide..."
          npm ci
        working-directory: ./frontend

      - name: Lancer les tests (unitaires et intégration)
        run: |
          echo " Exécution des tests avec Vitest..."
          npm test -- --run
        working-directory: ./frontend

      - name: Générer le rapport de couverture de code
        if: always() 
        run: |
          echo " Génération du rapport de couverture de code..."
          npm run coverage
        working-directory: ./frontend
        
      - name: Uploader le rapport de couverture comme artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-couverture-frontend
          path: frontend/coverage/
          retention-days: 7

  # ====================================================================
  # JOB 2 : CONSTRUIRE L'IMAGE DOCKER ET LA POUSSER SUR ACR (CD)
  # ====================================================================
  build-and-push-image:
    name: 2 - Build et Push de l'image Frontend
    runs-on: ubuntu-latest
    needs: test-frontend

    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à Azure Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Étape améliorée pour générer les tags de manière dynamique et propre.
      - name: Définir les métadonnées de l'image (tags et labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ACR_NAME }}.azurecr.io/darija-frontend
          tags: |
            type=sha,prefix=
            latest

      # ================================================================
      # ===> VERSION CORRIGÉE ET AMÉLIORÉE <============================
      # ================================================================
      - name: Build and Push Frontend Image
        id: build_and_push # ID ajouté pour pouvoir référencer les 'outputs'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }} # Utilise les tags générés par l'étape 'meta'
          labels: ${{ steps.meta.outputs.labels }}

      - name: Afficher le digest et les tags de l'image poussée
        # Cette étape est maintenant fiable car 'build_and_push' a un ID.
        run: |
          echo "✅ Image poussée avec succès !"
          echo "   Digest de l'image : ${{ steps.build_and_push.outputs.digest }}"
          echo "   Tags de l'image   : ${{ steps.meta.outputs.tags }}"
      # ================================================================
      # ===> FIN DE LA CORRECTION <=====================================
      # ================================================================

  # ======================================================================
  # JOB 3 : DÉPLOYER L'APPLICATION SUR AKS (DÉPLOIEMENT CONTINU - CD)
  # =====================================================================
  deploy-to-aks:
    name: 3 - Déploiement du Frontend sur AKS
    runs-on: self-hosted # ou ubuntu-latest
    needs: build-and-push-image

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation et configuration de kubectl
        run: |
          echo "Configuration de l'accès à Kubernetes..."
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Vérifier la connexion kubectl
        run: |
          echo "Vérification de la connexion au cluster AKS..."
          kubectl cluster-info
          echo "Liste des nœuds du cluster :"
          kubectl get nodes

      - name: Créer/Mettre à jour le secret unifié pour les APIs
        run: |
          echo "Création/Mise à jour du secret 'api-secrets'..."
          kubectl create secret generic api-secrets \
            --from-literal=ADMIN_USERNAME='${{ secrets.ADMIN_USERNAME }}' \
            --from-literal=ADMIN_PASSWORD='${{ secrets.ADMIN_PASSWORD }}' \
            --from-literal=SUPABASE_URL='${{ secrets.SUPABASE_URL }}' \
            --from-literal=JWT_SECRET='${{ secrets.JWT_SECRET }}' \
            --from-literal=BASE_URL='${{ secrets.BASE_URL }}' \
            --from-literal=VITE_DATA_API_BASE_URL='${{ secrets.VITE_DATA_API_BASE_URL }}' \
            --from-literal=VITE_IA_API_BASE_URL='${{ secrets.VITE_IA_API_BASE_URL }}' \
            --from-literal=HF_TOKEN_AI='${{ secrets.HF_TOKEN_AI }}' \
            --from-literal=HF_INFERENCE_ENDPOINT_URL='${{ secrets.HF_INFERENCE_ENDPOINT_URL }}' \
            --dry-run=client -o yaml | kubectl apply -f - --overwrite=true
          echo "Secret 'api-secrets' appliqué."

      - name: Mettre à jour le tag de l'image dans le manifeste Frontend
        run: |
          IMAGE_TAG=$(echo "${{ github.sha }}" | cut -c1-7) # Utilise un SHA court pour plus de lisibilité
          ACR_NAME=${{ secrets.ACR_NAME }}
          
          echo "Mise à jour de k8s/frontend.yaml avec l'image : $ACR_NAME.azurecr.io/darija-frontend:$IMAGE_TAG"
          
          sed -i "s|image: $ACR_NAME.azurecr.io/darija-frontend:.*|image: $ACR_NAME.azurecr.io/darija-frontend:$IMAGE_TAG|g" k8s/frontend.yaml
          
          echo "--- Contenu de k8s/frontend.yaml après modification ---"
          cat k8s/frontend.yaml
          echo "-----------------------------------------------------"

      - name: Déployer les manifestes Kubernetes
        run: |
          echo "Application du manifeste frontend.yaml au cluster AKS..."
          kubectl apply -f k8s/frontend.yaml
      
      - name: Vérifier l'état du déploiement
        run: |
          echo "Attente de la stabilisation du déploiement (rollout)..."
          kubectl rollout status deployment/frontend-deployment
          echo "✅ Déploiement du frontend terminé avec succès !"