name: "CI/CD AI Model Pipeline"

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: 🧪 Test & Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r api/ia_api/requirements.txt
          pip install -r database/requirements.txt
          pip install pytest pytest-cov
      - name: Run pytest suite
        run: pytest --maxfail=1 --disable-warnings -q

  train:
    name: 🚀 Entraînement du modèle
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install training dependencies
        run: |
          pip install --upgrade pip
          pip install -r llm/requirements.txt
          pip install -r api/ia_api/requirements.txt
      - name: Launch fine-tuning
        run: python llm/finetune_nllb_lora.py
      - name: Upload model checkpoint
        uses: actions/upload-artifact@v3
        with:
          name: model-checkpoint
          path: nllb-darija-lora-model

  package-model:
    name: 📦 Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    needs: train
    steps:
      - uses: actions/checkout@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nllb-darija:${{ github.sha }}

  deploy:
    name: 🚀 Déploiement en production
    runs-on: ubuntu-latest
    needs: package-model
    environment: production
    steps:
      - uses: actions/checkout@v3
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      - name: Configure Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > ~/.kube/config
      - name: Update deployment image
        run: |
          kubectl set image deployment/darija-api-deployment darija-api=ghcr.io/${{ github.repository_owner }}/nllb-darija:${{ github.sha }} --record
