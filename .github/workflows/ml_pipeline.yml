name: MLOps - Entraînement et Déploiement du Modèle

on:
  push:
    branches:
      - master
    paths:
      - 'llm/**'
      - 'tests/data/**'
      - '.github/workflows/ml_pipeline.yml'
  workflow_dispatch:

jobs:
  train-and-validate:
    name: 1 - Entraînement & Validation du Modèle
    runs-on: [self-hosted, linux, x64, gpu]
    environment: training

    env:
      MLFLOW_TRACKING_URI: http://127.0.0.1:5001 
      MLFLOW_EXPERIMENT_NAME: nllb_darija_finetuning
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      BASE_URL: ${{ secrets.DATA_API_BASE_URL }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Restaurer les checkpoints depuis le cache
        id: cache-checkpoints-restore
        uses: actions/cache/restore@v4
        with:
          path: ./nllb-darija-finetuned-lora-checkpoints
          key: checkpoints-${{ github.ref_name }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r api/ia_api/requirements.txt
          pip install pytest
          pip install requests
          pip install -r requirements.txt

      - name: Récupérer les dernières données d'entraînement via l'API
        run: |
          export PYTHONPATH=$(pwd)
          python llm/export_dataset.py

      - name: Lancer les tests de qualité des données
        run: |
          export PYTHONPATH=$(pwd)
          pytest tests/data/test_data_quality.py

      - name: Lancer le Fine-Tuning du modèle avec MLflow
        run: python llm/finetune_nllb_lora.py

      - name: Sauvegarder les checkpoints dans le cache
        # S'exécute toujours pour sauvegarder la progression en cas d'annulation ou d'échec
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ./nllb-darija-finetuned-lora-checkpoints
          # La clé est basée sur celle utilisée à la restauration pour une mise à jour efficace
          key: ${{ steps.cache-checkpoints-restore.outputs.cache-primary-key || 'checkpoints-${{ github.ref_name }}' }}
          
      - name: Sauvegarder l'artefact du modèle LoRA pour le job suivant
        uses: actions/upload-artifact@v4
        with:
          name: nllb-lora-model-artifact
          path: ./nllb-darija-lora-model/

      - name: Nettoyer le cache des checkpoints après succès
        # Ne s'exécute que si toutes les étapes précédentes ont réussi
        if: success()
        run: |
          echo "L'entraînement a réussi. Suppression du cache des checkpoints pour le prochain run."
          # Tente de supprimer le cache. L'échec n'est pas bloquant.
          gh cache delete checkpoints-${{ github.ref_name }} --repo ${{ github.repository }} --confirm || echo "Cache non trouvé ou échec de la suppression."
        env:
          # Le token est nécessaire pour que la CLI GitHub puisse s'authentifier auprès de l'API
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-model-to-hub:
    name: 2 - Déploiement du Modèle sur Hugging Face
    runs-on: ubuntu-latest
    needs: train-and-validate

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      
      - name: Installer Git LFS et Hugging Face Hub CLI
        run: |
          sudo apt-get update && sudo apt-get install git-lfs -y
          pip install huggingface_hub

      - name: Télécharger l'artefact du modèle
        uses: actions/download-artifact@v4
        with:
          name: nllb-lora-model-artifact
          path: ./nllb-darija-lora-model/

      - name: Push vers Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          huggingface-cli login --token $HF_TOKEN
          huggingface-cli upload \
            --repo-type model \
            Farid59/nllb-darija-lora-model \
            ./nllb-darija-lora-model/ \
            .