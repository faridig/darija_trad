# .github/workflows/ml_pipeline.yml

name: MLOps - Entraînement et Déploiement du Modèle

on:
  push:
    branches:
      - master
    paths:
      - 'llm/**'
      - 'tests/data/**'
      - '.github/workflows/ml_pipeline.yml'
  workflow_dispatch:

jobs:
  train-and-validate:
    name: 1 - Entraînement & Validation du Modèle
    runs-on: [self-hosted, linux, x64, gpu]
    environment: training

    # --- ENVIRONNEMENT CENTRALISÉ POUR TOUT LE JOB ---
    env:
      # Pour MLflow
      MLFLOW_TRACKING_URI: http://127.0.0.1:5001 
      MLFLOW_EXPERIMENT_NAME: nllb_darija_finetuning

      # Pour le script export_dataset.py
      # Assurez-vous que les secrets GitHub existent et sont corrects.
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      # On nomme cette variable BASE_URL pour qu'elle corresponde à ce que le script attend.
      BASE_URL: ${{ secrets.DATA_API_BASE_URL }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r api/ia_api/requirements.txt
          pip install pytest
          # Ajout de requests car utilisé par export_dataset.py
          pip install requests
          pip install -r requirements.txt

      # --- ÉTAPE SIMPLIFIÉE ---
      # Le script lira les variables d'environnement définies au niveau du job.
      - name: Récupérer les dernières données d'entraînement via l'API
        run: |
          export PYTHONPATH=$(pwd)
          python llm/export_dataset.py

      - name: Lancer les tests de qualité des données
        run: |
          export PYTHONPATH=$(pwd)
          pytest tests/data/test_data_quality.py

      - name: Lancer le Fine-Tuning du modèle avec MLflow
        run: python llm/finetune_nllb_lora.py

      - name: Sauvegarder l'artefact du modèle LoRA
        uses: actions/upload-artifact@v4
        with:
          name: nllb-lora-model-artifact
          path: ./nllb-darija-lora-model/

  # ... Le reste du fichier (job deploy-model-to-hub) est correct et reste inchangé ...
  deploy-model-to-hub:
    name: 2 - Déploiement du Modèle sur Hugging Face
    runs-on: ubuntu-latest
    needs: train-and-validate

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      
      - name: Installer Git LFS et Hugging Face Hub CLI
        run: |
          sudo apt-get update && sudo apt-get install git-lfs -y
          pip install huggingface_hub

      - name: Télécharger l'artefact du modèle
        uses: actions/download-artifact@v4
        with:
          name: nllb-lora-model-artifact
          path: ./nllb-darija-lora-model/

      - name: Push vers Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          huggingface-cli login --token $HF_TOKEN
          huggingface-cli upload \
            --repo-type model \
            Farid59/nllb-darija-lora-model \
            ./nllb-darija-lora-model/ \
            .