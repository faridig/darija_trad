name: MLOps - Entraînement, Validation et Déploiement du Modèle

on:
  push:
    branches:
      - master
    paths:
      # On surveille les fichiers pertinents pour l'entraînement
      - 'llm/**'
      - 'tests/data/**'
      - 'requirements.txt' # On surveille maintenant le fichier central
      - '.github/workflows/ml_pipeline.yml'
  workflow_dispatch:

jobs:
  # ===================================================================
  # JOB UNIQUE : Cycle de vie complet du modèle
  # ===================================================================
  train-validate-and-deploy:
    name: Cycle de vie complet du Modèle (Entraînement -> Déploiement)
    runs-on: [self-hosted, linux, x64, gpu]
    environment: training
    timeout-minutes: 1440 # 24 heures

    env:
      # --- NOUVEAU NOM DE DÉPÔT ---
      # Utilisé pour récupérer l'ancien score et pour le push
      HF_REPO_ID: "Farid59/nllb-darija-fr_eng"

      # Variables d'environnement standard
      MLFLOW_TRACKING_URI: http://127.0.0.1:5001 
      MLFLOW_EXPERIMENT_NAME: nllb_darija_finetuning
      PYTHONPATH: ${{ github.workspace }}
      # Assure que le dataloader ne crée pas de conflit
      TOKENIZERS_PARALLELISM: "false"

    steps:
      # -------------------------------------------------------------------
      # ÉTAPE 1 : PRÉPARATION ET ENTRAÎNEMENT
      # -------------------------------------------------------------------
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Restaurer les checkpoints et configurer le cache
        id: cache-checkpoints # On ajoute un id pour la clarté
        uses: actions/cache@v4
        with:
          path: ./nllb-darija-finetuned-lora-checkpoints
          # Clé unique pour le cache de CE run. Sera utilisée pour la sauvegarde à la fin du job.
          key: checkpoints-${{ github.run_id }}
          # Clé de restauration : on cherche le cache le plus récent qui commence par "checkpoints-"
          restore-keys: |
            checkpoints-

      - name: Setup Python 3.11 et dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Récupérer le corpus de données (si nécessaire)
        # Assurez-vous que les secrets pour cette étape sont configurés
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          BASE_URL: ${{ secrets.DATA_API_BASE_URL }}
        run: python llm/export_dataset.py

      - name: Préparer et diviser les datasets
        run: python llm/prepare_datasets.py
      
      - name: Lancer les tests de qualité sur les données
        run: pytest tests/data/test_data_quality.py

      - name: Lancer le Fine-Tuning du modèle (crée l'adaptateur)
        run: python llm/finetune_nllb_lora.py
      
      - name: Fusionner l'adaptateur dans un modèle complet
        if: success()
        run: |
          python llm/merge_and_save.py \
            "facebook/nllb-200-distilled-600M" \
            ./nllb-darija-lora-model/ \
            ./nllb-darija-merged-model/

      # -------------------------------------------------------------------
      # ÉTAPE 2 : VALIDATION COMPARATIVE ("Validation Gate")
      # -------------------------------------------------------------------
      - name: Évaluer le NOUVEAU modèle sur le jeu de test
        id: evaluate_new
        run: |
          # Le chemin pointe vers le modèle fusionné créé à l'étape précédente
          SCORE=$(python llm/evaluate_model.py ./nllb-darija-merged-model/ | grep 'SCORE_BLEU=' | cut -d'=' -f2)
          echo "Nouveau score BLEU : $SCORE"
          echo "bleu_score=$SCORE" >> "$GITHUB_OUTPUT"

      - name: Récupérer le score du modèle en PRODUCTION
        id: get_prod_score
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Télécharge le fichier d'évaluation depuis le NOUVEAU dépôt
          huggingface-cli download $HF_REPO_ID evaluation.json --local-dir . --repo-type model --token $HF_TOKEN || echo "evaluation.json non trouvé, score de prod mis à 0."
          if [ -f "evaluation.json" ]; then
            # Utilise jq pour extraire le score du JSON
            SCORE=$(jq .bleu_score evaluation.json)
          else
            SCORE=0
          fi
          echo "Score de production : $SCORE"
          echo "bleu_score=$SCORE" >> "$GITHUB_OUTPUT"

      - name: Comparer les scores et décider du déploiement
        id: compare
        run: |
          NEW_SCORE=${{ steps.evaluate_new.outputs.bleu_score }}
          PROD_SCORE=${{ steps.get_prod_score.outputs.bleu_score }}
          echo "Comparaison : Nouveau ($NEW_SCORE) vs. Production ($PROD_SCORE)"
          
          if [ -z "$NEW_SCORE" ]; then
            echo "::error::Le nouveau score BLEU est vide. Échec de l'évaluation."
            exit 1
          fi

          # Comparaison en virgule flottante
          IS_BETTER=$(python -c "print(float('${NEW_SCORE}') > float('${PROD_SCORE}'))")

          if [ "$IS_BETTER" == "True" ]; then
            echo "Le nouveau modèle est MEILLEUR. Déploiement autorisé."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Le nouveau modèle N'EST PAS meilleur. Déploiement annulé."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      # -------------------------------------------------------------------
      # ÉTAPE 3 : DÉPLOIEMENT CONDITIONNEL
      # -------------------------------------------------------------------
      - name: Déployer le nouveau modèle sur Hugging Face
        if: steps.compare.outputs.should_deploy == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "Déploiement du nouveau modèle vers ${HF_REPO_ID}..."
          # Créer le fichier d'évaluation avec le nouveau score
          echo '{"bleu_score": ${{ steps.evaluate_new.outputs.bleu_score }} }' > ./nllb-darija-merged-model/evaluation.json
          
          # Lancer l'upload vers le NOUVEAU dépôt
          huggingface-cli login --token $HF_TOKEN
          huggingface-cli upload \
            --repo-type model \
            $HF_REPO_ID \
            ./nllb-darija-merged-model/ \
            .
            
      # -------------------------------------------------------------------
      # ÉTAPE 4 : NETTOYAGE DU CACHE (S'EXÉCUTE TOUJOURS À LA FIN)
      # -------------------------------------------------------------------
      - name: Nettoyer les anciens caches de checkpoints
        # 'always()' garantit que cette étape s'exécute même si le déploiement est sauté
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Nettoyage des anciens caches de checkpoints..."
          # Liste tous les caches, garde les 2 plus récents, supprime les autres
          gh cache list --repo ${{ github.repository }} --sort created_at --order desc | \
          grep 'checkpoints-' | \
          sed '1,2d' | \
          awk '{print $1}' | \
          while read cacheKey; do
            echo "Suppression du cache ancien : $cacheKey"
            gh cache delete "$cacheKey" --repo ${{ github.repository }} --confirm || echo "Avertissement : impossible de supprimer le cache $cacheKey"
          done