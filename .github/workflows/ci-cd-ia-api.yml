name: CI/CD - Stack API IA (App + Monitoring)

# --- DÉCLENCHEURS ---
# Se déclenche quand le code de l'API IA, de la BDD ou du monitoring change.
on:
  push:
    branches: [ master ]
    paths:
      - 'api/ia_api/**'
      - 'database/**'
      - '.github/workflows/ci-cd-ia-api.yml'
  
  pull_request:
    branches: [ master ]
    paths:
      - 'api/ia_api/**'
      - 'database/**'

  workflow_dispatch:

# --- JOBS ---
jobs:
  # ===================================================================
  # JOB 1 : TESTER L'API (Intégration Continue)
  # ===================================================================
  test-api:
    name: 1 - Test de l'API IA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r api/ia_api/requirements.txt
          pip install -r database/requirements.txt
          pip install pytest pytest-cov

      - name: Lancer les tests et vérifier la couverture de l'API IA
        run: |
          export PYTHONPATH=$(pwd)
          pytest --cov=api/ia_api --cov-report=html --cov-report=term-missing --cov-fail-under=85 tests/api_ia/

      - name: Sauvegarder le rapport de couverture en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-couverture-api
          path: htmlcov/

  # ===================================================================
  # JOB 2 : CONSTRUIRE ET DÉPLOYER LES IMAGES DOCKER (avec utilisateur admin ACR)
  # Ne s'exécute que si les tests réussissent et sur un push vers 'master'.
  # ===================================================================
  build-and-deploy-images:
    name: 2 - Déploiement des images vers ACR
    runs-on: ubuntu-latest
    needs: test-api
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # --- Connexion à ACR avec utilisateur et mot de passe ---
      - name: Connexion à Azure Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          # L'URL de votre ACR
          registry: ${{ secrets.ACR_NAME }}.azurecr.io
          # Le nom d'utilisateur de l'admin ACR
          username: ${{ secrets.ACR_USERNAME }}
          # Le mot de passe de l'admin ACR
          password: ${{ secrets.ACR_PASSWORD }}
          
      # --- Étape 2.1 : Image de l'API IA ---
      - name: Build and Push IA API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/ia_api/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/darija-api:latest
            ${{ secrets.ACR_NAME }}.azurecr.io/darija-api:${{ github.sha }}

      # --- Étape 2.2 : Image de Prometheus ---
      - name: Build and Push Prometheus Image
        uses: docker/build-push-action@v5
        with:
          context: api/ia_api/prometheus
          file: api/ia_api/prometheus/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/darija-api-prometheus:latest
            ${{ secrets.ACR_NAME }}.azurecr.io/darija-api-prometheus:${{ github.sha }}
          
          secrets: | 
            prometheus_password=${{ secrets.ADMIN_PASSWORD }} # L'ID 'prometheus_password' doit correspondre à celui du Dockerfile

      # --- Étape 2.3 : Image de Grafana ---
      - name: Build and Push Grafana Image
        uses: docker/build-push-action@v5
        with:
          context: api/ia_api/grafana
          file: api/ia_api/grafana/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/darija-api-grafana:latest
            ${{ secrets.ACR_NAME }}.azurecr.io/darija-api-grafana:${{ github.sha }}