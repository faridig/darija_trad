name: CI/CD - Stack API IA (App + Monitoring)

# --- DÉCLENCHEURS ---
# Se déclenche quand le code de l'API IA, de la BDD ou du monitoring change.
on:
  push:
    branches: [ main ]
    paths:
      - 'api/ia_api/**'
      - 'database/**'
      - '.github/workflows/ci-cd-ia-api.yml'
  
  pull_request:
    branches: [ main ]
    paths:
      - 'api/ia_api/**'
      - 'database/**'

  workflow_dispatch:

# --- JOBS ---
jobs:
  # ===================================================================
  # JOB 1 : TESTER L'API (Intégration Continue)
  # ===================================================================
  test-api:
    name: 1 - Test de l'API IA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r api/ia_api/requirements.txt
          pip install -r database/requirements.txt
          pip install pytest

      - name: Lancer les tests de l'API IA
        run: |
          export PYTHONPATH=$(pwd)
          pytest tests/api_ia/

  # ===================================================================
  # JOB 2 : CONSTRUIRE ET DÉPLOYER LES IMAGES DOCKER
  # Ne s'exécute que si les tests réussissent et sur un push vers 'main'.
  # ===================================================================
  build-and-deploy-images:
    name: 2 - Déploiement des images vers ACR
    runs-on: ubuntu-latest
    needs: test-api
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Connexion à Azure Container Registry (ACR)
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_NAME }}.azurecr.io
          
      # --- Étape 2.1 : Image de l'API IA ---
      - name: Build and Push IA API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/ia_api/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/darija-api:latest
            ${{ secrets.ACR_NAME }}.azurecr.io/darija-api:${{ github.sha }}

      # --- Étape 2.2 : Image de Prometheus ---
      - name: Build and Push Prometheus Image
        uses: docker/build-push-action@v5
        with:
          # Le contexte est le dossier contenant le Dockerfile et les fichiers à copier
          context: api/ia_api/prometheus
          file: api/ia_api/prometheus/Dockerfile
          push: true
          # Nom du dépôt pour l'image Prometheus sur ACR
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/darija-api-prometheus:latest
            ${{ secrets.ACR_NAME }}.azurecr.io/darija-api-prometheus:${{ github.sha }}

      # --- Étape 2.3 : Image de Grafana ---
      - name: Build and Push Grafana Image
        uses: docker/build-push-action@v5
        with:
          context: api/ia_api/grafana
          file: api/ia_api/grafana/Dockerfile
          push: true
          # Nom du dépôt pour l'image Grafana sur ACR
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/darija-api-grafana:latest
            ${{ secrets.ACR_NAME }}.azurecr.io/darija-api-grafana:${{ github.sha }}

      - name: Déconnexion d'Azure
        run: az logout
        if: always()