name: CI/CD - Stack API IA (App + Monitoring)

# --- DÉCLENCHEURS (MIS À JOUR) ---
# Se déclenche si le code d'une des API, de la BDD, ou des dépendances change.
on:
  push:
    branches: [ master ]
    paths:
      - 'api/**'         # Surveille TOUT ce qui est dans le dossier 'api'
      - 'database/**'
      - 'requirements.txt' # Surveille le nouveau fichier de dépendances racine
      - '.github/workflows/ci-cd-ia-api.yml'
  
  pull_request:
    branches: [ master ]
    paths:
      - 'api/**'
      - 'database/**'
      - 'requirements.txt'

  workflow_dispatch:

# --- JOBS ---
jobs:
  # ===================================================================
  # JOB 1 : TESTER L'API (Intégration Continue)
  # ===================================================================
  test-api:
    name: 1 - Test de l'API IA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances depuis le fichier racine
        run: |
          python -m pip install --upgrade pip
          # CHANGEMENT CLÉ : On utilise le fichier requirements.txt à la racine
          pip install -r requirements.txt

      - name: Lancer les tests et vérifier la couverture de l'API IA
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

        run: |
          rm -rf ~/.cache/huggingface/hub
          export PYTHONPATH=$(pwd)
          pytest --cov=api/ia_api --cov-report=html --cov-report=term-missing --cov-fail-under=85 tests/api_ia/

      - name: Sauvegarder le rapport de couverture en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-couverture-api
          path: htmlcov/

  # ===================================================================
  # JOB 2 : CONSTRUIRE ET DÉPLOYER LES IMAGES DOCKER
  # (Aucun changement ici, mais attention au Dockerfile - voir ci-dessous)
  # ===================================================================
  build-and-deploy-images:
    name: 2 - Déploiement des images vers ACR
    runs-on: ubuntu-latest
    needs: test-api
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à Azure Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
          
      - name: Build and Push IA API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/ia_api/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/darija-api:latest
            ${{ secrets.ACR_NAME }}.azurecr.io/darija-api:${{ github.sha }}

      - name: Build and Push Prometheus Image
        uses: docker/build-push-action@v5
        with:
          context: api/ia_api/prometheus
          file: api/ia_api/prometheus/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/darija-api-prometheus:latest
            ${{ secrets.ACR_NAME }}.azurecr.io/darija-api-prometheus:${{ github.sha }}
          secrets: | 
            prometheus_password=${{ secrets.ADMIN_PASSWORD }}

      - name: Build and Push Grafana Image
        uses: docker/build-push-action@v5
        with:
          context: api/ia_api/grafana
          file: api/ia_api/grafana/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/darija-api-grafana:latest
            ${{ secrets.ACR_NAME }}.azurecr.io/darija-api-grafana:${{ github.sha }}

# ===================================================================
  # JOB 3 : DÉPLOYER SUR AZURE KUBERNETES SERVICE (AKS)
  # ===================================================================
  deploy-to-aks:
    name: 3 - Déploiement sur AKS via Self-Hosted Runner
    
    # --- LA MODIFICATION CLÉ EST ICI ---
    runs-on: self-hosted # Ou [self-hosted, linux, x64] si vous avez plusieurs types de runners
    
    needs: build-and-deploy-images

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # --- L'AUTHENTIFICATION N'EST PROBABLEMENT PLUS NÉCESSAIRE ---
      # Si votre runner tourne sur une VM Azure avec une Identité Managée
      # qui a les droits sur le cluster, vous n'avez même plus besoin de vous logger.
      # Sinon, la méthode KUBE_CONFIG est la plus sûre.

      - name: Installation et configuration de kubectl
        run: |
          # Cette étape suppose que kubectl est déjà installé sur votre runner
          # ou qu'il peut être installé.
          # On configure le kubeconfig comme avant.
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Vérifier la connexion kubectl
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Créer/Mettre à jour le secret pour l'API
        run: |
          kubectl create secret generic api-secrets \
            --from-literal=ADMIN_USERNAME='${{ secrets.ADMIN_USERNAME }}' \
            --from-literal=ADMIN_PASSWORD='${{ secrets.ADMIN_PASSWORD }}' \
            --from-literal=SUPABASE_URL='${{ secrets.SUPABASE_URL }}' \
            --dry-run=client -o yaml | kubectl apply -f -
      
      - name: Mettre à jour le tag de l'image dans les manifestes
        run: |
          IMAGE_TAG=${{ github.sha }}
          ACR_NAME=${{ secrets.ACR_NAME }}
          
          echo "Mise à jour des manifestes avec le tag : $IMAGE_TAG"
          
          # Remplace le tag pour l'API IA
          sed -i "s|image: $ACR_NAME.azurecr.io/darija-api:.*|image: $ACR_NAME.azurecr.io/darija-api:$IMAGE_TAG|g" k8s/api.yaml
          
          # Remplace le tag pour Prometheus
          sed -i "s|image: $ACR_NAME.azurecr.io/darija-api-prometheus:.*|image: $ACR_NAME.azurecr.io/darija-api-prometheus:$IMAGE_TAG|g" k8s/prometheus.yaml
          
          # Remplace le tag pour Grafana
          sed -i "s|image: $ACR_NAME.azurecr.io/darija-api-grafana:.*|image: $ACR_NAME.azurecr.io/darija-api-grafana:$IMAGE_TAG|g" k8s/grafana.yaml
          
          echo "Contenu de k8s/api.yaml après modification :"
          cat k8s/api.yaml
      
            
      - name: Déployer les manifestes Kubernetes
        run: |
          kubectl apply -f k8s/

      - name: Vérifier l'état du déploiement
        run: |
          kubectl rollout status deployment/ia-api-deployment
          kubectl rollout status deployment/prometheus-deployment
          kubectl rollout status deployment/grafana-deployment          