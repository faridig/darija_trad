# .github/workflows/ci-cd-ia-api.yml

name: CI/CD - Stack API IA (App + Monitoring)

on:
  push:
    branches: [ master ]
    paths:
      - 'api/**'
      - 'database/**'
      - 'requirements.txt'
      - 'k8s/**'
      - '.github/workflows/ci-cd-ia-api.yml'
  
  pull_request:
    branches: [ master ]
    paths:
      - 'api/**'
      - 'database/**'
      - 'requirements.txt'
      - 'k8s/**'

  workflow_dispatch:

jobs:
  # ====================================================================
  # JOB 1 : TESTER L'API (Intégration Continue) - INCHANGÉ
  # ====================================================================
  test-api:
    name: 1 - Test de l'API IA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances depuis le fichier racine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer les tests et vérifier la couverture de l'API IA
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          HF_INFERENCE_ENDPOINT_URL: "https://dummy.api.huggingface.co"
          HF_TOKEN_AI: "hf_dummy_token_for_testing"
        run: |
          rm -rf ~/.cache/huggingface/hub
          export PYTHONPATH=$(pwd)
          pytest --cov=api/ia_api --cov-report=html --cov-report=term-missing --cov-fail-under=85 tests/api_ia/

      - name: Sauvegarder le rapport de couverture en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-couverture-api
          path: htmlcov/

  # ===================================================================
  # JOB 2 : CONSTRUIRE ET DÉPLOYER LES IMAGES DOCKER - INCHANGÉ
  # ===================================================================
  build-and-deploy-images:
    name: 2 - Déploiement des images vers ACR
    runs-on: ubuntu-latest
    needs: test-api
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à Azure Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
          
      - name: Build and Push IA API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/ia_api/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/darija-api:latest
            ${{ secrets.ACR_NAME }}.azurecr.io/darija-api:${{ github.sha }}

      - name: Build and Push Prometheus Image
        uses: docker/build-push-action@v5
        with:
          context: api/ia_api/prometheus
          file: api/ia_api/prometheus/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/darija-api-prometheus:latest
            ${{ secrets.ACR_NAME }}.azurecr.io/darija-api-prometheus:${{ github.sha }}
          secrets: | 
            prometheus_password=${{ secrets.ADMIN_PASSWORD }}

      - name: Build and Push Grafana Image
        uses: docker/build-push-action@v5
        with:
          context: api/ia_api/grafana
          file: api/ia_api/grafana/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/darija-api-grafana:latest
            ${{ secrets.ACR_NAME }}.azurecr.io/darija-api-grafana:${{ github.sha }}

  # ====================================================================
  # JOB 3 : DÉPLOYER SUR AKS (LOGIQUE SÉQUENTIELLE AMÉLIORÉE)
  # ===================================================================
  deploy-to-aks:
    name: 3 - Déploiement Séquentiel sur AKS
    runs-on: self-hosted # ou ubuntu-latest
    needs: build-and-deploy-images
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Créer/Mettre à jour le secret unifié pour les APIs
        run: |
          kubectl create secret generic api-secrets \
            --from-literal=ADMIN_USERNAME='${{ secrets.ADMIN_USERNAME }}' \
            --from-literal=ADMIN_PASSWORD='${{ secrets.ADMIN_PASSWORD }}' \
            --from-literal=SUPABASE_URL='${{ secrets.SUPABASE_URL }}' \
            --from-literal=JWT_SECRET='${{ secrets.JWT_SECRET }}' \
            --from-literal=BASE_URL='${{ secrets.BASE_URL }}' \
            --from-literal=VITE_DATA_API_BASE_URL='${{ secrets.VITE_DATA_API_BASE_URL }}' \
            --from-literal=VITE_IA_API_BASE_URL='${{ secrets.VITE_IA_API_BASE_URL }}' \
            --from-literal=HF_TOKEN_AI='${{ secrets.HF_TOKEN_AI }}' \
            --from-literal=HF_INFERENCE_ENDPOINT_URL='${{ secrets.HF_INFERENCE_ENDPOINT_URL }}' \
            --dry-run=client -o yaml | kubectl apply -f -
      
      - name: Mettre à jour les tags des images dans les manifestes
        run: |
          IMAGE_TAG=${{ github.sha }}
          ACR_NAME=${{ secrets.ACR_NAME }}
          sed -i "s|image: $ACR_NAME.azurecr.io/darija-api:.*|image: $ACR_NAME.azurecr.io/darija-api:$IMAGE_TAG|g" k8s/api.yaml
          sed -i "s|image: $ACR_NAME.azurecr.io/darija-api-prometheus:.*|image: $ACR_NAME.azurecr.io/darija-api-prometheus:$IMAGE_TAG|g" k8s/prometheus.yaml
          sed -i "s|image: $ACR_NAME.azurecr.io/darija-api-grafana:.*|image: $ACR_NAME.azurecr.io/darija-api-grafana:$IMAGE_TAG|g" k8s/grafana.yaml
          # Note: Pas besoin de sed pour Alertmanager car on utilise une image publique.

      # ==================================================================
      # ===> DÉBUT DES MODIFICATIONS : DÉPLOIEMENT SÉQUENTIEL <===========
      # ==================================================================

      - name: Étape 1 - Déployer l'API IA uniquement
        run: |
          echo "Déploiement du composant le plus critique : l'API IA..."
          kubectl apply -f k8s/api.yaml
      
      - name: Étape 2 - Attendre la stabilisation de l'API IA
        run: |
          echo "Attente de la stabilisation de l'API IA (peut prendre jusqu'à 15 minutes)..."
          # Le timeout est crucial car le chargement du modèle est long.
          kubectl rollout status deployment/ia-api-deployment --timeout=15m

      - name: Étape 3 - Déployer les composants de monitoring
        run: |
          echo "L'API IA est stable. Déploiement des composants de monitoring..."
          kubectl apply -f k8s/prometheus.yaml
          kubectl apply -f k8s/grafana.yaml
          kubectl apply -f k8s/alertmanager.yaml

      - name: Étape 4 - Attendre la stabilisation du monitoring
        run: |
          echo "Attente de la stabilisation de Prometheus..."
          kubectl rollout status deployment/prometheus-deployment --timeout=2m

          echo "Attente de la stabilisation de Grafana..."
          kubectl rollout status deployment/grafana-deployment --timeout=2m
          
          echo "Attente de la stabilisation d'Alertmanager..."
          kubectl rollout status deployment/alertmanager-deployment --timeout=1m

      - name: Étape 5 - Activer l'Autoscaler (HPA) sur un service stable
        if: success() # Ne s'exécute que si TOUS les déploiements précédents sont stables
        run: |
          echo "Tous les déploiements sont stables. Activation de l'HPA pour l'API IA."
          kubectl apply -f k8s/ia-api-hpa.yaml