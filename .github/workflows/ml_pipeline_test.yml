# name: MLOps - [TEST RAPIDE] Entraînement, Validation et Déploiement

on:
    workflow_dispatch: # On le lance manuellement pour les tests
  
  jobs:
    # ===================================================================
    # JOB 1 : SIMULATION D'ENTRAÎNEMENT
    # ===================================================================
    train-and-validate-fast:
      name: 1 - (Simulation) Entraînement & Validation
      runs-on: ubuntu-latest # MODIFICATION: Pas besoin de GPU pour simuler, un runner standard suffit et est plus rapide à démarrer.
  
      env:
        # On peut garder les envs, même si elles ne sont pas utilisées, pour vérifier qu'elles sont bien passées.
        MLFLOW_TRACKING_URI: http://127.0.0.1:5001 
        MLFLOW_EXPERIMENT_NAME: nllb_darija_finetuning_test
        ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        BASE_URL: ${{ secrets.DATA_API_BASE_URL }}
        PYTHONPATH: ${{ github.workspace }}
  
      steps:
        - name: Checkout du code
          uses: actions/checkout@v4
  
        # PRÉ-REQUIS : Créez ces fichiers vides ou avec un contenu minimal dans votre repo
        # un fichier : tests/data/dummy_test_dataset.json
        # un fichier : tests/data/dummy_model/config.json (peut être vide)
        # un fichier : tests/data/dummy_model/pytorch_model.bin (peut être vide)
  
        - name: Setup Python 3.11
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'
        
        - name: Installer les dépendances (si nécessaire pour les scripts de test)
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
  
        - name: (Simulation) Préparer et diviser les datasets
          run: |
            echo "Simulation de la préparation du dataset de test..."
            # On copie un petit fichier de test pré-existant au lieu de le générer
            cp tests/data/dummy_test_dataset.json test_dataset.json
            echo "Faux dataset de test créé."
  
        - name: Lancer les tests de qualité sur les données
          run: pytest tests/data/test_data_quality.py
  
        - name: (Simulation) Lancer le Fine-Tuning du modèle
          run: |
            echo "Simulation du fine-tuning..."
            # On crée un faux répertoire de modèle avec les fichiers attendus par le job suivant
            mkdir -p ./nllb-darija-lora-model/
            cp -r tests/data/dummy_model/* ./nllb-darija-lora-model/
            echo "Faux modèle LoRA créé."
            sleep 10 # Simule un peu de temps de travail
  
        - name: Sauvegarder l'artefact du FAUX modèle LoRA pour le job suivant
          uses: actions/upload-artifact@v4
          with:
            name: nllb-lora-model-artifact
            path: ./nllb-darija-lora-model/
        
        - name: Sauvegarder l'artefact du FAUX jeu de test pour le job de validation
          uses: actions/upload-artifact@v4
          with:
            name: test-dataset-artifact
            path: test_dataset.json
  
    # ===================================================================
    # JOB 2 : VALIDATION COMPARATIVE ACCÉLÉRÉE
    # ===================================================================
    validate-and-compare-fast:
      name: 2 - (Rapide) Validation et Comparaison
      runs-on: [self-hosted, linux, x64, gpu] # MODIFICATION: Passage sur GPU comme demandé
      needs: train-and-validate-fast
      outputs:
        is_better: ${{ steps.compare.outputs.is_better }}
        new_bleu_score: ${{ steps.evaluate_new.outputs.bleu_score }}
  
      env:
        MLFLOW_TRACKING_URI: "file:./mlruns-temp-eval"
        PYTHONPATH: ${{ github.workspace }}
  
      steps:
        - name: Checkout du code
          uses: actions/checkout@v4
        
        - name: Setup Python 3.11 et dépendances
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'
        - run: |
            pip install -r requirements.txt
            pip install huggingface_hub datasets evaluate sacrebleu jq
            pip install torch # Assure que la bonne version de torch pour GPU est là
  
        - name: Télécharger l'artefact du nouveau modèle (simulé)
          uses: actions/download-artifact@v4
          with:
            name: nllb-lora-model-artifact
            path: ./new-model-to-evaluate/
        
        - name: Télécharger l'artefact du jeu de test (simulé)
          uses: actions/download-artifact@v4
          with:
            name: test-dataset-artifact
            path: .
  
        - name: Évaluer le NOUVEAU modèle sur un extrait (ou simuler)
          id: evaluate_new
          run: |
            echo "Simulation de l'évaluation du nouveau modèle..."
            # OPTION 1 : Simulation pure (plus rapide)
            # On force un score élevé pour s'assurer que le job de déploiement se lance.
            SCORE="99.9"
            
            # OPTION 2 : Vraie évaluation sur un extrait (si vous voulez tester le script evaluate_model.py)
            # Assurez-vous que votre script accepte un argument pour limiter le nombre d'échantillons
            # SCORE=$(python llm/evaluate_model.py ./new-model-to-evaluate/ --max_samples=4 | grep 'SCORE_BLEU=' | cut -d'=' -f2)
            
            echo "Nouveau score BLEU (simulé) : $SCORE"
            echo "bleu_score=$SCORE" >> "$GITHUB_OUTPUT"
  
        - name: (Simulation) Récupérer le score du modèle en PRODUCTION
          id: get_prod_score
          run: |
            echo "Simulation de la récupération du score de prod..."
            # On force un score bas pour que la comparaison réussisse
            SCORE="10.0"
            echo "Score de production (simulé) : $SCORE"
            echo "bleu_score=$SCORE" >> "$GITHUB_OUTPUT"
  
        - name: Comparer les scores (simulés)
          id: compare
          run: |
            NEW_SCORE=${{ steps.evaluate_new.outputs.bleu_score }}
            PROD_SCORE=${{ steps.get_prod_score.outputs.bleu_score }}
            echo "Comparaison : Nouveau ($NEW_SCORE) vs. Production ($PROD_SCORE)"
            
            IS_BETTER=$(python -c "print(float('${NEW_SCORE}') > float('${PROD_SCORE}'))")
  
            if [ "$IS_BETTER" == "True" ]; then
              echo "Le nouveau modèle est meilleur. Déploiement autorisé."
              echo "is_better=true" >> "$GITHUB_OUTPUT"
            else
              echo "Le nouveau modèle n'est PAS meilleur. Déploiement annulé."
              echo "is_better=false" >> "$GITHUB_OUTPUT"
              exit 1 # Important de faire échouer le test si la logique ne passe pas comme prévu
            fi
  
    # ===================================================================
    # JOB 3 : DÉPLOIEMENT CONDITIONNEL (TEST DE PUSH)
    # ===================================================================
    deploy-model-to-hub:
      name: 3 - (Test de Push) Déploiement sur Hugging Face
      runs-on: ubuntu-latest
      needs: validate-and-compare-fast
      if: needs.validate-and-compare-fast.outputs.is_better == 'true'
  
      steps:
        - name: Télécharger l'artefact du modèle (simulé)
          uses: actions/download-artifact@v4
          with:
            name: nllb-lora-model-artifact
            path: ./nllb-darija-lora-model/
  
        - name: Créer le fichier d'évaluation pour le nouveau modèle
          run: |
            echo '{"bleu_score": ${{ needs.validate-and-compare-fast.outputs.new_bleu_score }} }' > ./nllb-darija-lora-model/evaluation.json
            echo "Fichier evaluation.json créé avec le score : ${{ needs.validate-and-compare-fast.outputs.new_bleu_score }}"
  
        - name: Installer Git LFS et Hugging Face Hub CLI
          run: |
            # L'installation de git-lfs reste une bonne pratique même si non utilisé pour ce petit fichier
            sudo apt-get update && sudo apt-get install git-lfs -y
            pip install huggingface_hub
  
        - name: Push du score d'évaluation (Test de déploiement)
          env:
            HF_TOKEN: ${{ secrets.HF_TOKEN }}
          run: |
            huggingface-cli login --token $HF_TOKEN
            
            # Commande pour pousser UN SEUL FICHIER
            # Cela valide l'authentification, les permissions et la connexion au repo
            # sans envoyer les gros fichiers du modèle.
            huggingface-cli upload \
              --repo-type model \
              --commit-message "[CI TEST] Mise à jour du score d'évaluation" \
              Farid59/nllb-darija-lora-model \
              ./nllb-darija-lora-model/evaluation.json \
              evaluation.json
              
            echo "✅ Test de push réussi. Le fichier evaluation.json a été poussé sur le Hub."