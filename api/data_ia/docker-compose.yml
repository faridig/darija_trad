version: '3.8'

services:
  app:
    build:
      context: ../..  # Le contexte racine du projet
      dockerfile: api/data_ia/Dockerfile
    container_name: darija_api
    env_file:
      - ../../.env
    ports:
      - "8001:8001"  # Port interne et externe alignés
    networks:
      - monitoring_net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/prometheus_password.secret:/run/secrets/prometheus_password:ro
    ports:
      - "9090:9090"
    depends_on:
      - app
    networks:
      - monitoring_net
  

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - monitoring_net

networks:
  monitoring_net:
    driver: bridge

secrets:
  prometheus_password:
    file: ./prometheus/prometheus_password.secret
