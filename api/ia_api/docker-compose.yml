# api/ia_api/docker-compose.yml
version: '3.8'

services:
  app:
    build:
      context: ../..  
      dockerfile: api/ia_api/Dockerfile
    container_name: darija_api
    env_file:
      - ../../.env
    ports:
      - "8001:8001"
    networks:
      - monitoring_net

  prometheus:
    build:
      context: ./prometheus  
      # MODIFICATION CLÉ : On indique le nom du Dockerfile à utiliser pour le local
      dockerfile: Dockerfile.local 
    container_name: prometheus
    volumes:
      # Ce volume est toujours utile pour pouvoir modifier la config sans reconstruire l'image
      - ./prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'
      - '--alertmanager.url=http://alertmanager:9093' 
    environment:
       - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    ports:
      - "9090:9090"
    depends_on:
      - app
      - alertmanager
    networks:
      - monitoring_net
  
  grafana:
    build:
      context: ./grafana     
      dockerfile: Dockerfile
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      # Note : Le fichier de datasource pour Grafana est déjà correct
      - ./grafana/provisioning/datasources/prometheus.local.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml
    depends_on:
      - prometheus
    networks:
      - monitoring_net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - "9093:9093"
    networks:
      - monitoring_net

volumes:
  grafana-storage:

networks:
  monitoring_net:
    driver: bridge